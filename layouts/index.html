<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>daniel dewar website</title>
    <meta name="viewport" content="initial-scale=1.0, width=device-width" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <style>
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        background: #141410;
        color: #e6dfc9;
        font-family: 'Courier New', monospace;
      }
      main {
        min-height: 100svh;
        position: relative;
        isolation: isolate;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }
      .scene {
        position: absolute;
        inset: 0;
        z-index: -1;
        overflow: hidden;
        background: #141410;
      }
      .poster, .scene canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center 55%;
        image-rendering: pixelated;
      }
      .scene canvas { opacity: 0; transition: opacity .4s; }
      .scene canvas.ready { opacity: 1; }
      .shade {
        position: absolute;
        inset: 0;
        background: linear-gradient(180deg, #090b0b70 0%, transparent 25%, transparent 55%, #080b0dd6 100%);
      }
      header {
        display: flex;
        justify-content: flex-end;
        padding: 32px 40px;
        text-shadow: 0 1px 5px #000;
      }
      .time {
        display: flex;
        align-items: center;
        gap: 10px;
        font-variant-numeric: tabular-nums;
        font-size: 20px;
      }
      .zone { font-size: 12px; letter-spacing: .13em; color: #c1bcae; }
      .dot {
        width: 5px;
        height: 5px;
        display: block;
        background: #c2c880;
        box-shadow: 0 0 8px #b4c37f60;
      }
      .projects {
        padding: 0 40px 36px;
        max-width: 760px;
        font-size: 18px;
        line-height: 1.4;
        text-shadow: 0 1px 4px #000, 0 0 12px #00000080;
      }
      .projects p { margin: 0 0 20px; color: #e6dfc9; }
      .projects .desc { color: #b5b29d; }
      .projects a {
        color: #ddcb88;
        text-decoration: none;
        border: 1px solid #8c8b6f40;
        background: #12161299;
        padding: 3px 8px;
        margin: -3px 0;
      }
      .projects a:hover {
        color: #191810;
        background: #dacf96;
        border-color: #dacf96;
        text-shadow: none;
      }
      @media (max-width: 640px) {
        header { padding: 22px 20px; }
        .time { font-size: 18px; }
        .zone { display: none; }
        .projects { padding: 0 20px 24px; font-size: 15px; }
        .projects p { margin-bottom: 16px; }
        .scene canvas, .poster { object-position: 59% 50%; }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="scene">
        <img class="poster" src="/skyline.png" alt="Pixel art of Brooklyn Bridge and the Manhattan skyline seen from the rocky DUMBO waterfront." />
        <canvas id="skyline" width="768" height="512" role="img" aria-label="Animated pixel skyline. Gentle East River waves, changing daylight, and illuminated windows after dusk."></canvas>
        <div class="shade"></div>
      </div>
      <header>
        <div class="time"><span class="dot"></span><span id="clock">--:--</span><span class="zone">NEW YORK</span></div>
      </header>
      <section class="projects">
        <p>Projects:</p>
        <p><a href="https://unitedmasters.com" target="_blank" rel="noopener">UnitedMasters ↗</a> <span class="desc">independent music distribution</span></p>
        <p><a href="https://apps.apple.com/app/sublime-to-do/id1578437064" target="_blank" rel="noopener">Sublime To Do ↗</a> <span class="desc">download on app store</span></p>
      </section>
    </main>
    <script>
      (function () {
        var W = 768, H = 512;
        var zone = 'America/New_York';
        function newYorkMinutes() {
          var parts = new Intl.DateTimeFormat('en-US', { timeZone: zone, hourCycle: 'h23', hour: '2-digit', minute: '2-digit', second: '2-digit' }).formatToParts(new Date());
          function part(name) {
            for (var i = 0; i < parts.length; i++) if (parts[i].type === name) return Number(parts[i].value) || 0;
            return 0;
          }
          return part('hour') * 60 + part('minute') + part('second') / 60;
        }
        var keys = [
          { h: 0, c: [.48, .56, .78], lift: [0, 0, 2], night: 1 },
          { h: 5, c: [.52, .58, .80], lift: [1, 0, 3], night: 1 },
          { h: 6.5, c: [1.13, .87, .89], lift: [12, 5, 9], night: .25 },
          { h: 9, c: [1.40, 1.44, 1.33], lift: [13, 17, 17], night: 0 },
          { h: 13, c: [1.62, 1.62, 1.43], lift: [18, 24, 23], night: 0 },
          { h: 16.5, c: [1.55, 1.36, 1.04], lift: [16, 14, 8], night: 0 },
          { h: 18.5, c: [1.38, .91, .73], lift: [15, 5, 8], night: .3 },
          { h: 20, c: [.65, .69, 1.01], lift: [2, 2, 8], night: .9 },
          { h: 22, c: [.48, .56, .78], lift: [0, 0, 2], night: 1 },
          { h: 24, c: [.48, .56, .78], lift: [0, 0, 2], night: 1 }
        ];
        function palette(minutes) {
          var h = ((minutes / 60) % 24 + 24) % 24;
          var i = -1;
          for (var j = 0; j < keys.length - 1; j++) if (h >= keys[j].h && h < keys[j + 1].h) { i = j; break; }
          var a = keys[Math.max(0, i)], b = keys[Math.max(0, i) + 1];
          var t = (h - a.h) / (b.h - a.h); t = t * t * (3 - 2 * t);
          return {
            c: a.c.map(function (v, k) { return v + (b.c[k] - v) * t; }),
            lift: a.lift.map(function (v, k) { return v + (b.lift[k] - v) * t; }),
            night: a.night + (b.night - a.night) * t
          };
        }
        function clock(m) {
          var n = Math.floor(m) % 1440;
          return String(Math.floor(n / 60)).padStart(2, '0') + ':' + String(n % 60).padStart(2, '0');
        }

        var minute = newYorkMinutes();
        var clockEl = document.getElementById('clock');
        clockEl.textContent = clock(minute);
        setInterval(function () {
          minute = newYorkMinutes();
          clockEl.textContent = clock(minute);
        }, 1000);

        var waterPaused = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

        var el = document.getElementById('skyline');
        var ctx = el.getContext('2d');
        if (!ctx) return;
        var base = document.createElement('canvas'); base.width = W; base.height = H;
        var bx = base.getContext('2d', { willReadFrequently: true });
        var graded = document.createElement('canvas'); graded.width = W; graded.height = H;
        var gx = graded.getContext('2d');
        var img = new Image();
        var last = 0, time = 0, cache = -1, original;
        img.onload = function () {
          bx.drawImage(img, 0, 0, W, H);
          original = bx.getImageData(0, 0, W, H);
          el.classList.add('ready');
          function animate(now) {
            requestAnimationFrame(animate);
            if (now - last < 50) return;
            var dt = Math.min(100, now - last); last = now;
            if (document.hidden) return;
            if (!waterPaused) time += dt / 1000;
            var bucket = Math.floor(minute * 2);
            if (bucket !== cache) {
              cache = bucket;
              var p = palette(minute);
              var data = new ImageData(new Uint8ClampedArray(original.data), W, H);
              for (var i = 0; i < data.data.length; i += 4) {
                var r = original.data[i], g = original.data[i + 1], b = original.data[i + 2];
                var warm = r > 70 && r > b * 1.28 && g > b * 1.08;
                var light = warm ? p.night * .55 : 0;
                data.data[i] = Math.min(255, r * (p.c[0] + light) + p.lift[0]);
                data.data[i + 1] = Math.min(255, g * (p.c[1] + light * .65) + p.lift[1]);
                data.data[i + 2] = Math.min(255, b * p.c[2] + p.lift[2]);
              }
              gx.putImageData(data, 0, 0);
            }
            ctx.imageSmoothingEnabled = false;
            ctx.drawImage(graded, 0, 0);
            // Water mask follows the generated shoreline, leaving the bridge and rocks fixed.
            ctx.save(); ctx.beginPath();
            ctx.moveTo(0, 298); ctx.lineTo(200, 298); ctx.lineTo(355, 286); ctx.lineTo(W, 285); ctx.lineTo(W, 498); ctx.lineTo(692, 477); ctx.lineTo(590, 465); ctx.lineTo(535, 443); ctx.lineTo(460, 451); ctx.lineTo(380, 432); ctx.lineTo(310, 428); ctx.lineTo(240, 411); ctx.lineTo(170, 413); ctx.lineTo(110, 396); ctx.lineTo(55, 387); ctx.lineTo(0, 377);
            ctx.closePath(); ctx.clip();
            for (var y = 285; y < H; y++) {
              var depth = (y - 285) / (H - 285);
              var dx = Math.round(Math.sin(y * .19 - time * 1.25) * (.3 + depth * 1.6) + Math.sin(y * .061 + time * .8) * depth);
              var dy = Math.round(Math.sin(time * .9 + y * .085) * depth);
              ctx.drawImage(graded, 0, Math.max(285, Math.min(H - 1, y + dy)), W, 1, dx, y, W, 1);
            }
            ctx.restore();
          }
          requestAnimationFrame(animate);
        };
        img.src = '/skyline.png';
      })();
    </script>
  </body>
</html>
